<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}body{background:var(--bc-surface);color:var(--bc-ink);font-family:var(--font-sans)}#root{padding:24px;display:flex;flex-direction:column;gap:24px;box-sizing:border-box}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.col{flex:1 1 220px;min-width:0}</style></head>
<body><div id="root"></div>
<script>
var B = window.BlockConcepts, h = React.createElement;
function App(){return h('div',{className:'row'},
 h('div',{className:'col'},h(B.Radio,{legend:'Sourcing tier',options:[{value:'c',label:'Components'},{value:'m',label:'Modules'},{value:'full',label:'Complete machine'}],defaultValue:'m'})),
 h('div',{className:'col'},h(B.Radio,{legend:'Power',options:[{value:'a',label:'120 V'},{value:'b',label:'240 V'}],error:'Choose the supply voltage.'})));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
