<!-- @dsCard group="Layouts" height=520 subtitle="Tab bar, then 1/5 + 1/5 + 3/5" -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}body{background:var(--bc-surface);color:var(--bc-ink);font-family:var(--font-sans)}#root{padding:24px;display:flex;flex-direction:column;gap:24px;box-sizing:border-box}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.col{flex:1 1 220px;min-width:0}</style></head>
<body><div id="root"></div>
<script>
var B = window.BlockConcepts, h = React.createElement;
function App(){var cat=['Drawings','Specs','Templates','Guides'].map(function(l,i){return{id:'c'+i,label:l}}),it=['Cap torque cell','Print farm cell','Inspection station','VFD enclosure'].map(function(l,i){return{id:'i'+i,label:l}});
 return h(B.GrabLayout,{tabs:[{id:'a',label:'Mechanical'},{id:'b',label:'Controls'},{id:'c',label:'Process'},{id:'d',label:'Install'}],tab:undefined,
  columnA:h(B.ListBox,{items:cat,label:'Categories',defaultValue:'c0',height:'380px'}),columnB:h(B.ListBox,{items:it,label:'Items',defaultValue:'i0',search:true,height:'380px'}),
  detail:h(B.DetailPane,{title:'Cap torque cell',description:'Measures removal torque on every part.',whenToUse:'Use when caps are checked by hand.',revisions:[{id:'r2',label:'Rev B'},{id:'r1',label:'Rev A'}],downloadLabel:'Download PDF'})});}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
