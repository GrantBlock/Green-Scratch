<!-- @dsCard group="Feedback" height=290 subtitle="Success, info, warning and error" -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}body{background:var(--bc-surface);color:var(--bc-ink);font-family:var(--font-sans)}#root{padding:24px;display:flex;flex-direction:column;gap:24px;box-sizing:border-box}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.col{flex:1 1 220px;min-width:0}</style></head>
<body><div id="root"></div>
<script>
var B = window.BlockConcepts, h = React.createElement;
function App(){return h('div',{style:{display:'flex',flexDirection:'column',gap:12,alignItems:'flex-start'}},['success','info','warning','error'].map(function(t){return h(B.Toast,{key:t,tone:t,onClose:function(){}},{success:'Build State updated to Purchasing.',info:'3 changes are staged.',warning:'This revision is not the latest.',error:'The file could not be saved.'}[t]);}));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
