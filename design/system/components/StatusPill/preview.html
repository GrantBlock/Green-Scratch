<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}body{background:var(--bc-surface);color:var(--bc-ink);font-family:var(--font-sans)}#root{padding:24px;display:flex;flex-direction:column;gap:24px;box-sizing:border-box}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.col{flex:1 1 220px;min-width:0}</style></head>
<body><div id="root"></div>
<script>
var B = window.BlockConcepts, h = React.createElement;
function App(){function grp(t,k,vs){return h('div',{key:t},h('p',{className:'bc-label bc-label--muted',style:{margin:'0 0 8px'}},t),h('div',{className:'row',style:{gap:8}},vs.map(function(v){return h(B.StatusPill,{key:v,kind:k,value:v})})));}
 return h(React.Fragment,null,grp('Status','status',['New','Contacted','Quoted','Closed']),grp('Build State','build',['Quoting','Designing','Purchasing','Manufacturing','Assembling','Completed']),grp('Feedback','feedback',['error','warning','success','info']));}
