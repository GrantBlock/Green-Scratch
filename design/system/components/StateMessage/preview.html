<!-- @dsCard group="Feedback" height=250 subtitle="Empty, loading and error" -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}body{background:var(--bc-surface);color:var(--bc-ink);font-family:var(--font-sans)}#root{padding:24px;display:flex;flex-direction:column;gap:24px;box-sizing:border-box}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.col{flex:1 1 220px;min-width:0}</style></head>
<body><div id="root"></div>
<script>
var B = window.BlockConcepts, h = React.createElement;
function App(){return h('div',{className:'row'},
 h('div',{className:'col'},h(B.StateMessage,{kind:'empty',title:'No customers yet',children:'Customers appear here after the first quote request.'})),
 h('div',{className:'col'},h(B.StateMessage,{kind:'loading',title:'Loading the Log List'})),
 h('div',{className:'col'},h(B.StateMessage,{kind:'error',title:'The list did not load',children:'Check your connection and try again.',action:h(B.Button,{variant:'secondary',className:'bc-button--compact'},'Try again')})));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
