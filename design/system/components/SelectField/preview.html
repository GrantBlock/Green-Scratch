<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}body{background:var(--bc-surface);color:var(--bc-ink);font-family:var(--font-sans)}#root{padding:24px;display:flex;flex-direction:column;gap:24px;box-sizing:border-box}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.col{flex:1 1 220px;min-width:0}</style></head>
<body><div id="root"></div>
<script>
var B = window.BlockConcepts, h = React.createElement;
function App(){return h('div',{className:'row'},
 h('div',{className:'col'},h(B.SelectField,{label:'Station Type',options:['Pick and place','Conveyor','Inspection','Press'],defaultValue:'Conveyor'})),
 h('div',{className:'col'},h(B.SelectField,{label:'Flow Direction',options:['Left \u2192 Right','Right \u2192 Left','Vertical'],error:'Choose a direction.'})),
 h('div',{className:'col'},h(B.SelectField,{label:'Industry',options:['Packaging and dispensing'],disabled:true})));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
